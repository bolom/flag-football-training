<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidéos — ig-videos</title>
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --surface-2: #1d1d20;
    --line: rgba(255, 255, 255, .10);
    --line-strong: rgba(255, 255, 255, .18);
    --text: rgba(255, 255, 255, .93);
    --muted: rgba(255, 255, 255, .52);
    --accent: oklch(.87 .19 128);
    --accent-ink: #0a0a0b;
    --shadow: 0 40px 100px -24px rgba(0, 0, 0, .75);
    --radius: 14px;
    --card-min: 172px;
    --gutter: 14px;
    --bar: rgba(10, 10, 11, .72);
  }

  [data-theme="light"] {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface-2: #eceae4;
    --line: rgba(20, 20, 22, .11);
    --line-strong: rgba(20, 20, 22, .2);
    --text: rgba(18, 18, 20, .92);
    --muted: rgba(18, 18, 20, .55);
    --accent: oklch(.64 .17 132);
    --accent-ink: #ffffff;
    --shadow: 0 40px 90px -30px rgba(0, 0, 0, .35);
    --bar: rgba(245, 244, 241, .78);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Barre supérieure ---------- */

  .bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    padding: 12px 20px;
    background: var(--bar);
    backdrop-filter: saturate(1.4) blur(18px);
    -webkit-backdrop-filter: saturate(1.4) blur(18px);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-right: auto;
    min-width: 0;
  }

  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -.01em;
    white-space: nowrap;
  }

  .brand .stats {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px;
    height: 34px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    transition: border-color .15s ease;
  }

  .field:focus-within { border-color: var(--line-strong); }

  .field svg { flex: none; opacity: .45; }

  .field input {
    width: 190px;
    border: 0;
    background: none;
    outline: none;
  }

  .field input::placeholder { color: var(--muted); }

  select {
    height: 34px;
    padding: 0 26px 0 10px;
    background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3.5 5 7.5 9 3.5' fill='none' stroke='%23888' stroke-width='1.4' stroke-linecap='round'/></svg>") no-repeat right 9px center;
    border: 1px solid var(--line);
    border-radius: 9px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
  }

  .seg button {
    display: grid;
    place-items: center;
    width: 30px;
    height: 28px;
    background: none;
    border: 0;
    border-radius: 7px;
    color: var(--muted);
    cursor: pointer;
  }

  .seg button[aria-pressed="true"] {
    background: var(--surface-2);
    color: var(--text);
  }

  .toggle, .icon-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 11px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--muted);
    cursor: pointer;
  }

  .toggle[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--text);
  }

  .toggle[aria-pressed="true"] .tick {
    background: var(--accent);
    border-color: var(--accent);
  }

  .tick {
    display: grid;
    place-items: center;
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--line-strong);
    border-radius: 4px;
    font-size: 10px;
    line-height: 1;
    color: var(--accent-ink);
  }

  .icon-btn { width: 34px; padding: 0; justify-content: center; }

  /* ---------- Grille ---------- */

  main {
    padding: 22px 20px 60px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
    gap: 22px var(--gutter);
    margin: 0 auto;
    max-width: 1680px;
  }

  .card {
    display: grid;
    gap: 9px;
    padding: 0;
    background: none;
    border: 0;
    text-align: left;
    color: inherit;
    cursor: pointer;
  }

  .poster {
    position: relative;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background: var(--surface-2);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    transition: border-color .18s ease;
  }

  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .45s cubic-bezier(.2, .7, .3, 1), filter .18s ease;
  }

  .card:hover .poster img,
  .card:focus-visible .poster img { transform: scale(1.035); }

  .card:hover .poster { border-color: var(--line-strong); }

  .poster .play {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    transition: opacity .18s ease;
    background: linear-gradient(to top, rgba(0, 0, 0, .45), rgba(0, 0, 0, 0) 45%);
  }

  .card:hover .play,
  .card:focus-visible .play { opacity: 1; }

  .play span {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    padding-left: 3px;
  }

  .badge {
    position: absolute;
    right: 8px;
    bottom: 8px;
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(0, 0, 0, .74);
    color: #fff;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .01em;
  }

  .seen {
    position: absolute;
    top: 8px;
    right: 8px;
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
  }

  .track {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255, 255, 255, .22);
  }

  .track i {
    display: block;
    height: 100%;
    background: var(--accent);
  }

  .meta {
    display: grid;
    gap: 2px;
    min-width: 0;
  }

  .meta .owner {
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta .sub {
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    padding: 80px 0;
    text-align: center;
    color: var(--muted);
  }

  footer {
    max-width: 1680px;
    margin: 0 auto;
    padding: 0 20px 48px;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
  }

  footer a { color: inherit; }

  /* ---------- Visionneuse ---------- */

  .viewer {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .viewer[hidden] { display: none; }

  .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 6, .88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .panel {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, calc(min(88vh, 940px) * var(--ar, .5625))) 348px;
    grid-template-rows: minmax(0, 1fr);
    width: max-content;
    max-width: 96vw;
    height: min(88vh, 940px);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }

  .stage {
    position: relative;
    min-width: 0;
    background: #000;
  }

  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }

  .pager {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pager button {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    flex: none;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }

  .pager button:hover { border-color: var(--line-strong); }
  .pager button[disabled] { opacity: .28; cursor: default; }
  .pager .spacer { flex: 1; }

  .pager .count {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 24px 22px;
    overflow-y: auto;
    border-left: 1px solid var(--line);
  }

  .info-head {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .avatar {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    flex: none;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .info-head .who { min-width: 0; }
  .info-head .who b { display: block; font-size: 14px; }
  .info-head .who small { color: var(--muted); font-size: 11.5px; }

  .caption {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    text-wrap: pretty;
  }

  .caption.clamped {
    display: -webkit-box;
    -webkit-line-clamp: 7;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .more {
    align-self: flex-start;
    padding: 0;
    background: none;
    border: 0;
    color: var(--accent);
    font-size: 12.5px;
    cursor: pointer;
  }

  .facts {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 7px 18px;
    margin: 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
  }

  .facts dt { color: var(--muted); }
  .facts dd {
    margin: 0;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
    text-decoration: none;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  .btn:hover { border-color: var(--line-strong); }

  .btn.primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-ink);
    font-weight: 600;
  }

  .btn.copied { color: var(--accent); }

  .hint {
    margin: 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.7;
  }

  kbd {
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--surface-2);
    font-family: inherit;
    font-size: 10.5px;
  }

  @media (max-width: 880px) {
    .brand .stats { display: none; }
    .field input { width: 100%; }
    .field { flex: 1 1 160px; }
    .panel {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      height: 92vh;
      width: 96vw;
    }
    .info {
      border-left: 0;
      border-top: 1px solid var(--line);
      max-height: 40vh;
    }
    .actions { margin-top: 14px; }
    .viewer { padding: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <h1>Vidéos</h1>
    <p class="stats" id="stats"></p>
  </div>

  <div class="tools">
    <label class="field">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M10.5 10.5 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <input id="q" type="search" placeholder="Compte, légende, shortcode…" aria-label="Rechercher">
    </label>

    <select id="account" aria-label="Filtrer par compte"></select>
    <select id="sort" aria-label="Trier">
      <option value="recent">Plus récentes</option>
      <option value="oldest">Plus anciennes</option>
      <option value="owner">Compte (A→Z)</option>
      <option value="long">Durée (décroissant)</option>
      <option value="heavy">Poids (décroissant)</option>
    </select>

    <button class="toggle" id="unseen" type="button" aria-pressed="false">
      <span class="tick">✓</span> Non vues
    </button>

    <div class="seg" role="group" aria-label="Taille des vignettes">
      <button type="button" data-size="132" title="Petites vignettes" aria-label="Petites vignettes">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="4" height="4" fill="currentColor"/><rect x="6" y="1" width="4" height="4" fill="currentColor"/><rect x="11" y="1" width="4" height="4" fill="currentColor"/><rect x="1" y="6" width="4" height="4" fill="currentColor"/><rect x="6" y="6" width="4" height="4" fill="currentColor"/><rect x="11" y="6" width="4" height="4" fill="currentColor"/></svg>
      </button>
      <button type="button" data-size="172" title="Vignettes moyennes" aria-label="Vignettes moyennes">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="currentColor"/><rect x="9" y="1" width="6" height="6" fill="currentColor"/><rect x="1" y="9" width="6" height="6" fill="currentColor"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/></svg>
      </button>
      <button type="button" data-size="248" title="Grandes vignettes" aria-label="Grandes vignettes">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="6" fill="currentColor"/><rect x="1" y="9" width="14" height="6" fill="currentColor"/></svg>
      </button>
    </div>

    <button class="icon-btn" id="theme" type="button" title="Changer de thème" aria-label="Changer de thème"></button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Aucune vidéo ne correspond à ces critères.</p>
</main>

<footer>
  <span id="foot"></span>
  <a href="seance-mardi.html">Séance de mardi</a>
  <a href="README.md">README</a>
  <a href="manifeste.txt">manifeste</a>
  <a href="urls-video.tsv">urls-video.tsv</a>
</footer>

<div class="viewer" id="viewer" hidden>
  <div class="backdrop" data-close></div>

  <div class="panel" role="dialog" aria-modal="true" aria-label="Lecture de la vidéo">
    <div class="stage">
      <video id="player" controls playsinline preload="metadata"></video>
    </div>

    <aside class="info">
      <div class="pager">
        <button id="prev" type="button" aria-label="Vidéo précédente">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <span class="count" id="counter"></span>
        <button id="next" type="button" aria-label="Vidéo suivante">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <span class="spacer"></span>
        <button id="close" type="button" aria-label="Fermer">
          <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
        </button>
      </div>

      <div class="info-head">
        <div class="avatar" id="avatar"></div>
        <div class="who">
          <b id="who"></b>
          <small id="when"></small>
        </div>
      </div>

      <div>
        <p class="caption clamped" id="caption"></p>
        <button class="more" id="more" type="button" hidden>Voir plus</button>
      </div>

      <dl class="facts" id="facts"></dl>

      <div class="actions">
        <a class="btn primary" id="ig" href="#" target="_blank" rel="noopener">Ouvrir la source</a>
        <a class="btn" id="openfile" href="#" target="_blank" rel="noopener">Ouvrir le fichier .mp4</a>
        <button class="btn" id="copy" type="button">Copier le chemin local</button>
      </div>

      <p class="hint">
        <kbd>←</kbd> <kbd>→</kbd> naviguer · <kbd>Espace</kbd> lecture · <kbd>M</kbd> muet · <kbd>F</kbd> plein écran · <kbd>Échap</kbd> fermer
      </p>
    </aside>

  </div>
</div>

<script id="igv-data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("igv-data").textContent);
  var ITEMS = DATA.items;
  var ROOT_DIR = DATA.dir;

  var STORE = {
    read: function (key, fallback) {
      try {
        var raw = localStorage.getItem("igv." + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    write: function (key, value) {
      try { localStorage.setItem("igv." + key, JSON.stringify(value)); } catch (e) {}
    }
  };

  var progress = STORE.read("progress", {});
  var prefs = STORE.read("prefs", { theme: "dark", size: 172, sort: "recent" });

  var el = {
    grid: document.getElementById("grid"),
    empty: document.getElementById("empty"),
    q: document.getElementById("q"),
    account: document.getElementById("account"),
    sort: document.getElementById("sort"),
    unseen: document.getElementById("unseen"),
    theme: document.getElementById("theme"),
    stats: document.getElementById("stats"),
    foot: document.getElementById("foot"),
    viewer: document.getElementById("viewer"),
    panel: document.querySelector(".panel"),
    player: document.getElementById("player"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next"),
    close: document.getElementById("close"),
    counter: document.getElementById("counter"),
    avatar: document.getElementById("avatar"),
    who: document.getElementById("who"),
    when: document.getElementById("when"),
    caption: document.getElementById("caption"),
    more: document.getElementById("more"),
    facts: document.getElementById("facts"),
    ig: document.getElementById("ig"),
    openfile: document.getElementById("openfile"),
    copy: document.getElementById("copy")
  };

  var state = { query: "", account: "", sort: prefs.sort || "recent", unseen: false, view: [] };
  var current = -1;

  var nf = new Intl.NumberFormat("fr-FR");

  function fmtDuration(seconds) {
    var s = Math.max(0, Math.round(seconds));
    var m = Math.floor(s / 60);
    return m + ":" + String(s % 60).padStart(2, "0");
  }

  function fmtSize(bytes) {
    if (bytes >= 1024 * 1024 * 1024) return (bytes / 1073741824).toFixed(2).replace(".", ",") + " Go";
    return (bytes / 1048576).toFixed(1).replace(".", ",") + " Mo";
  }

  function fmtDate(ts) {
    return new Date(ts * 1000).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  }

  function ratio(item) {
    var p = progress[item.file];
    if (!p || !item.duration) return 0;
    return Math.min(1, p / item.duration);
  }

  function isSeen(item) { return ratio(item) >= 0.9; }

  /* ---------- Rendu ---------- */

  function matches(item) {
    if (state.account && item.owner !== state.account) return false;
    if (state.unseen && isSeen(item)) return false;
    if (!state.query) return true;
    var hay = (item.owner + " " + item.shortcode + " " + item.caption).toLowerCase();
    return hay.indexOf(state.query) !== -1;
  }

  function sorted(items) {
    var list = items.slice();
    if (state.sort === "oldest") list.sort(function (a, b) { return a.takenAt - b.takenAt; });
    else if (state.sort === "owner") list.sort(function (a, b) { return a.owner.localeCompare(b.owner) || b.takenAt - a.takenAt; });
    else if (state.sort === "long") list.sort(function (a, b) { return b.duration - a.duration; });
    else if (state.sort === "heavy") list.sort(function (a, b) { return b.size - a.size; });
    else list.sort(function (a, b) { return b.takenAt - a.takenAt; });
    return list;
  }

  function card(item, index) {
    var card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.index = String(index);

    var poster = document.createElement("div");
    poster.className = "poster";

    var img = document.createElement("img");
    img.src = item.thumb;
    img.alt = "Aperçu de la vidéo de @" + item.owner;
    img.loading = "lazy";
    img.decoding = "async";
    poster.appendChild(img);

    var play = document.createElement("div");
    play.className = "play";
    play.innerHTML = '<span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"></path></svg></span>';
    poster.appendChild(play);

    if (isSeen(item)) {
      var seen = document.createElement("div");
      seen.className = "seen";
      seen.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
      seen.title = "Vue";
      poster.appendChild(seen);
    }

    var p = ratio(item);
    if (p > 0.01) {
      var track = document.createElement("div");
      track.className = "track";
      var fill = document.createElement("i");
      fill.style.width = (p * 100).toFixed(1) + "%";
      track.appendChild(fill);
      poster.appendChild(track);
    }

    var badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = fmtDuration(item.duration);
    poster.appendChild(badge);

    var meta = document.createElement("div");
    meta.className = "meta";
    var owner = document.createElement("div");
    owner.className = "owner";
    owner.textContent = "@" + item.owner;
    var sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = fmtDate(item.takenAt) + " · " + fmtSize(item.size);
    meta.appendChild(owner);
    meta.appendChild(sub);

    card.appendChild(poster);
    card.appendChild(meta);
    card.addEventListener("click", function () { open(index); });
    return card;
  }

  function render() {
    var items = sorted(ITEMS.filter(matches));
    state.view = items;
    el.grid.textContent = "";
    var frag = document.createDocumentFragment();
    items.forEach(function (item, i) { frag.appendChild(card(item, i)); });
    el.grid.appendChild(frag);
    el.empty.hidden = items.length > 0;
    el.grid.hidden = items.length === 0;
  }

  function renderStats() {
    var totalBytes = ITEMS.reduce(function (n, i) { return n + i.size; }, 0);
    var totalSeconds = ITEMS.reduce(function (n, i) { return n + i.duration; }, 0);
    var seen = ITEMS.filter(isSeen).length;
    el.stats.textContent = ITEMS.length + " vidéos · " + fmtSize(totalBytes) + " · " + fmtDuration(totalSeconds) + " · " + seen + " vue" + (seen > 1 ? "s" : "");
    el.foot.textContent = ITEMS.length + " fichiers dans videos/ — aperçus générés dans thumbs/. Progression de lecture enregistrée localement.";
  }

  /* ---------- Visionneuse ---------- */

  function open(index) {
    current = index;
    var item = state.view[current];
    if (item && history.replaceState) history.replaceState(null, "", "#" + item.shortcode);
    el.viewer.hidden = false;
    document.body.style.overflow = "hidden";
    load(state.view[current]);
    el.close.focus();
  }

  function close() {
    saveProgress(true);
    el.player.pause();
    el.player.removeAttribute("src");
    el.player.load();
    el.viewer.hidden = true;
    document.body.style.overflow = "";
    if (history.replaceState) history.replaceState(null, "", location.pathname);
    var item = state.view[current];
    render();
    renderStats();
    if (item) {
      var cards = el.grid.querySelectorAll(".card");
      for (var i = 0; i < state.view.length; i++) {
        if (state.view[i] === item && cards[i]) { cards[i].focus(); break; }
      }
    }
  }

  function load(item) {
    saveProgress(true);
    el.player.src = item.file;
    el.player.poster = item.thumb;
    el.player.currentTime = 0;
    var saved = progress[item.file] || 0;
    if (saved > 0) {
      el.player.addEventListener("loadedmetadata", function once() {
        el.player.removeEventListener("loadedmetadata", once);
        if (saved < item.duration - 1.5) el.player.currentTime = saved;
      });
    }
    el.player.play().catch(function () {});

    el.panel.style.setProperty("--ar", (item.w / item.h).toFixed(4));
    el.avatar.textContent = item.owner.charAt(0);
    el.who.textContent = "@" + item.owner;
    el.when.textContent = fmtDate(item.takenAt);
    el.caption.textContent = item.caption || "(pas de légende)";
    el.caption.classList.add("clamped");
    el.more.textContent = "Voir plus";
    el.more.hidden = (item.caption || "").length < 160;

    el.facts.textContent = "";
    var facts = [
      ["Shortcode", item.shortcode],
      ["Durée", fmtDuration(item.duration)],
      ["Poids", fmtSize(item.size)],
      ["Résolution", item.w + " × " + item.h],
      ["Fichier", item.file.replace(/^videos\//, "")]
    ];
    facts.forEach(function (pair) {
      var dt = document.createElement("dt");
      dt.textContent = pair[0];
      var dd = document.createElement("dd");
      dd.textContent = pair[1];
      el.facts.appendChild(dt);
      el.facts.appendChild(dd);
    });

    el.ig.textContent = "Ouvrir sur " + (item.source || "la source");
    el.ig.href = item.url || "#";
    el.ig.hidden = !item.url;
    el.openfile.href = item.file;
    el.counter.textContent = (current + 1) + " / " + state.view.length;
    el.prev.disabled = current === 0;
    el.next.disabled = current === state.view.length - 1;
    document.querySelector(".info").scrollTop = 0;
  }

  function step(delta) {
    var target = current + delta;
    if (target < 0 || target >= state.view.length) return;
    current = target;
    load(state.view[current]);
  }

  function saveProgress(immediate) {
    var item = state.view[current];
    if (!item || !el.player.duration || !isFinite(el.player.duration)) return;
    progress[item.file] = el.player.currentTime;
    if (immediate) STORE.write("progress", progress);
  }

  var saveTimer = null;
  el.player.addEventListener("timeupdate", function () {
    if (saveTimer) return;
    saveTimer = setTimeout(function () {
      saveTimer = null;
      saveProgress(true);
    }, 2000);
  });

  el.player.addEventListener("error", function () {
    if (!el.player.getAttribute("src")) return;
    el.caption.textContent = "Lecture impossible — le fichier est introuvable (" + el.player.getAttribute("src") + ")";
    el.caption.classList.remove("clamped");
  });

  el.prev.addEventListener("click", function () { step(-1); });
  el.next.addEventListener("click", function () { step(1); });
  el.close.addEventListener("click", close);
  el.viewer.addEventListener("click", function (e) { if (e.target.hasAttribute("data-close") || e.target.closest("[data-close]")) close(); });

  el.more.addEventListener("click", function () {
    var clamped = el.caption.classList.toggle("clamped");
    el.more.textContent = clamped ? "Voir plus" : "Voir moins";
  });

  el.openfile.addEventListener("click", function (e) {
    if (!el.openfile.getAttribute("href") || el.openfile.getAttribute("href") === "#") e.preventDefault();
  });

  el.copy.addEventListener("click", function () {
    var item = state.view[current];
    if (!item) return;
    var local = location.protocol === "file:";
    var path = local ? ROOT_DIR + "/" + item.file : new URL(item.file, location.href).href;
    var done = function () {
      el.copy.textContent = local ? "Chemin copié" : "Lien copié";
      el.copy.classList.add("copied");
      setTimeout(function () {
        el.copy.textContent = local ? "Copier le chemin local" : "Copier le lien de la vidéo";
        el.copy.classList.remove("copied");
      }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(path).then(done, function () { fallbackCopy(path, done); });
    } else {
      fallbackCopy(path, done);
    }
  });

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.addEventListener("keydown", function (e) {
    if (el.viewer.hidden) {
      if (e.key === "/" && document.activeElement !== el.q) { e.preventDefault(); el.q.focus(); }
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === " ") {
      e.preventDefault();
      if (el.player.paused) el.player.play().catch(function () {}); else el.player.pause();
    } else if (e.key === "m" || e.key === "M") { el.player.muted = !el.player.muted; }
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen();
      else el.player.requestFullscreen && el.player.requestFullscreen();
    }
  });

  /* ---------- Contrôles ---------- */

  var accounts = Array.from(new Set(ITEMS.map(function (i) { return i.owner; }))).sort(function (a, b) { return a.localeCompare(b); });
  var all = document.createElement("option");
  all.value = "";
  all.textContent = "Tous les comptes";
  el.account.appendChild(all);

  accounts.forEach(function (owner) {
    var opt = document.createElement("option");
    opt.value = owner;
    opt.textContent = "@" + owner;
    el.account.appendChild(opt);
  });

  el.q.addEventListener("input", function () { state.query = el.q.value.trim().toLowerCase(); render(); });
  el.account.addEventListener("change", function () { state.account = el.account.value; render(); });
  el.sort.addEventListener("change", function () { state.sort = el.sort.value; prefs.sort = state.sort; STORE.write("prefs", prefs); render(); });
  el.unseen.addEventListener("click", function () {
    state.unseen = !state.unseen;
    el.unseen.setAttribute("aria-pressed", String(state.unseen));
    render();
  });

  function setSize(px) {
    prefs.size = px;
    STORE.write("prefs", prefs);
    document.documentElement.style.setProperty("--card-min", px + "px");
    Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.size) === px));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
    b.addEventListener("click", function () { setSize(Number(b.dataset.size)); });
  });

  var SUN = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M8 .8v1.8M8 13.4v1.8M.8 8h1.8M13.4 8h1.8M2.9 2.9l1.3 1.3M11.8 11.8l1.3 1.3M13.1 2.9l-1.3 1.3M4.2 11.8l-1.3 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"></path></svg>';
  var MOON = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8 5.8 5.8 0 1 0 13.2 9.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>';

  function setTheme(theme) {
    prefs.theme = theme;
    STORE.write("prefs", prefs);
    document.documentElement.dataset.theme = theme;
    el.theme.innerHTML = theme === "dark" ? SUN : MOON;
    el.theme.title = theme === "dark" ? "Passer en clair" : "Passer en sombre";
  }

  el.theme.addEventListener("click", function () {
    setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  /* ---------- Démarrage ---------- */

  if (location.protocol !== "file:") {
    el.copy.textContent = "Copier le lien de la vidéo";
    el.openfile.textContent = "Ouvrir la vidéo";
  }

  el.sort.value = state.sort;
  setSize(prefs.size || 172);
  setTheme(prefs.theme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  render();
  renderStats();

  var opening = location.hash.slice(1);
  if (opening) {
    var found = state.view.findIndex(function (i) { return i.shortcode === opening; });
    if (found !== -1) open(found);
  }
})();
</script>
</body>
</html>
